name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install dependencies
        run: pip install -r requirements-ci.txt
      - name: Lint (ruff)
        run: ruff check serving webapp api tests
      - name: Tests (pytest)
        run: pytest -q

  docker-build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: webapp/Dockerfile
          push: false
          tags: android_a2_ops-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Pushing would use secrets stored in Settings -> Secrets and variables -> Actions, e.g.
      #   username: ${{ secrets.DOCKERHUB_USERNAME }}   password: ${{ secrets.DOCKERHUB_TOKEN }}
      # never literal values in this file.
